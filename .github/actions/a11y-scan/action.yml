name: A11y scan
description: >
  Run the axe accessibility suite in a11y/ against a deployed site, build the
  report, write it to the job summary and upload it as artifact.
  The repository must be checked out before using this action.

inputs:
  base-url:
    description: Base URL of the site to scan (no trailing slash needed).
    required: true
  suite:
    description: Test suite to run, "templates" (one page per template) or "full" (every sitemap URL).
    required: true
  fail-on:
    description: >
      Comma-separated axe impacts that make the action fail, e.g. "critical,serious".
      Empty = report only, never fail on violations.
    required: false
    default: ""
  workers:
    description: Number of pages scanned in parallel.
    required: false
    default: "4"
  retention-days:
    description: Artifact retention in days (0 = repository default).
    required: false
    default: "0"

outputs:
  summary-path:
    description: Path of the Markdown summary (exists only if the report was built).
    value: ${{ github.workspace }}/a11y/reports/summary.md

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.13.1
        cache: npm
        cache-dependency-path: a11y/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: a11y
      run: |
        npm ci
        npx playwright install --with-deps chromium

    - name: Run ${{ inputs.suite }} scan
      shell: bash
      working-directory: a11y
      env:
        BASE_URL: ${{ inputs.base-url }}
        SUITE: ${{ inputs.suite }}
        A11Y_WORKERS: ${{ inputs.workers }}
      run: |
        case "$SUITE" in
          templates|full) npm run "test:$SUITE" ;;
          *) echo "::error::Unknown suite '$SUITE' (expected templates|full)"; exit 1 ;;
        esac

    - name: Build report
      if: always()
      shell: bash
      working-directory: a11y
      env:
        BASE_URL: ${{ inputs.base-url }}
        A11Y_FAIL_ON: ${{ inputs.fail-on }}
      run: npm run report

    - name: Job summary
      if: always()
      shell: bash
      working-directory: a11y
      run: |
        if [ -f reports/summary.md ]; then
          cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: a11y-reports
        path: a11y/reports
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ignore
