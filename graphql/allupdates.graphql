#import "./fragments.graphql"

query AllUpdates {
  allUpdates(first: 200, orderBy: customUpdateDate_DESC) {
    __typename
    _createdAt
    _updatedAt
    id
    title
    customUpdateDate
    idAvvisoSalesforce
    beneficiari {
      label
      id
    }
    cta {
      ...ButtonFragment
    }
  }
  _allUpdatesMeta {
    count
  }
}
