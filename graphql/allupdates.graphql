#import "./fragments.graphql"

query AllUpdates {
  allUpdates(first: 200, orderBy: customUpdateDate_ASC) {
    id
    __typename
    _createdAt
    _updatedAt
    title
    customUpdateDate
    beneficiari {
      label
      id
    }
    cta {
      ...ButtonFragment
    }
  }
  _allUpdatesMeta {
    count
  }
}
