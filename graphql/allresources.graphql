#import "./fragments.graphql"

query AllResources {
  allResources(first: 100) {
    title
    slug
    customUpdateDate
    body {
      ... on HeroRecord {
        ...HeroFragment
      }
      ... on DataHeroRecord {
        ...DataHeroFragment
      }
      ... on SplitBannerRecord {
        ...SplitBannerFragment
      }
      ... on BannerRecord {
        ...BannerFragment
      }
      ... on RichTextRecord {
        ...RichTextFragment
      }
      ... on VideoPlayerRecord {
        ...VideoPlayerFragment
      }
      ... on CardsGridRecord {
        ...CardsGridFragment
      }
      ... on LayoutSidebarRecord {
        ...LayoutSidebarFragment
      }
    }
  }
  _allResourcesMeta {
    count
  }
}
