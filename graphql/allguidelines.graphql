#import "./fragments.graphql"

query AllGuidelines {
  allGuidelines(first: 200) {
    __typename
    _createdAt
    _updatedAt
    id
    title
    descrizione
    customUpdateDate
    allegato {
      id
      size
      filename
      url
      format
    }
    beneficiari {
      label
      id
      labelSalesforce
    }
    misura {
      label
      slug
      basePath
      idSalesforce
      pacchetto
    }
  }
  _allGuidelinesMeta {
    count
  }
}