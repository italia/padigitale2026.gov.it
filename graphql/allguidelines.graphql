#import "./fragments.graphql"

query AllGuidelines {
  allGuidelines(first: 200) {
    __typename
    _createdAt
    _updatedAt
    id
    title
    descrizione
    allegato {
      id
      size
      filename
      url
    }
    idAvvisoSalesforce
    beneficiari {
      label
      id
      labelSalesforce
    }
  }
  _allUpdatesMeta {
    count
  }
}