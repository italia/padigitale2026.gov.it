#import "./fragments.graphql"

query AllPages {
  allPages(first: 100) {
    _createdAt
    _updatedAt
    id
    title
    slug
    customUpdateDate
    nascondiValutazione
    seo: _seoMetaTags {
      attributes
      content
      tag
    }
    body {
      ... on HeroRecord {
        ...HeroFragment
      }
      ... on SplitBannerRecord {
        ...SplitBannerFragment
      }
      ... on BannerRecord {
        ...BannerFragment
      }
      ... on RichTextSectionRecord {
        ...RichTextSectionFragment
      }
      ... on VideoPlayerRecord {
        ...VideoPlayerFragment
      }
      ... on CardsGridGenericRecord {
        ...CardsGridGenericFragment
      }
      ... on CardsGridAttachmentRecord {
        ...CardsGridAttachmentFragment
      }
      ... on CardsGridServiceRecord {
        ...CardsGridServiceFragment
      }
      ... on CardsGridNewsRecord {
        ...CardsGridNewsFragment
      }
      ... on CardsGridGuidelineRecord {
        ...CardsGridGuidelineFragment
      }
      ... on CardsGridResourceRecord {
        ...CardsGridResourceFragment
      }
      ... on CardsGridAnnouncementRecord {
        ...CardsGridAnnouncementFragment
      }
      ... on CardsGridImageRecord {
        ...CardsGridImagesFragment
      }
      ... on LayoutSidebarRecord {
        ...LayoutSidebarFragment
      }
      ... on LayoutSidebarFilterRecord {
        ...LayoutSidebarFilterFragment
      }
      ... on TableListRecord {
        ...TableListFragment
      }
      ... on TableListFaqRecord {
        ...TableListFaqFragment
      }
      ... on TableListUpdateRecord {
        ...TableListUpdateFragment
      }
      ... on CardsListFilterRecord {
        ...CardsListFilterFragment
      }
      ... on HeroSearchRecord {
        ...HeroSearchFragment
      }
      ... on InstantSearchFaqRecord {
        ...InstantSearchFaqFragment
      }
      ... on BloccoGraficoRecord {
        ...BloccoGraficoFragment
      }
      ... on TabsWrapRecord {
        ...TabsWrapFragment
      }
      ... on FormNewsletterRecord {
        ...FormNewsletterFragment
      }
      ... on FormToRecord {
        ...FormToFragment
      }
      ... on FormAssistanceRecord {
        ...FormAssistanceFragment
      }
      ... on ImageTextColumnRecord {
        ...ImageTextColumnFragment
      }
      ... on TextColumnRecord {
        ...TextColumnFragment
      }
      ... on TextBicolumnRecord {
        ...TextBicolumnFragment
      }
      ... on TimelineRecord {
        ...TimelineFragment
      }
      ... on ImmagineRecord {
        ...ImmagineFragment
      }
    }
  }
  _allPagesMeta {
    count
  }
}
