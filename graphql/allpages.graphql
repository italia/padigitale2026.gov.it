#import "./fragments.graphql"

query AllPages {
  allPages(first: 100) {
    title
    slug
    customUpdateDate
    body {
      ... on AlertRecord {
        __typename
        text
        color
      }
      ... on ButtonRecord {
        ...ButtonFragment
      }
      ... on HeroRecord {
        __typename
        lightTheme
        hideBreadcrumbs
        title
        description
        updateDate
        image {
          responsiveImage {
            ...ImageFragment
          }
        }
        button {
          ...ButtonFragment
        }
      }
      ... on DataHeroRecord {
        __typename
        hideBreadcrumbs
        title
        updateDate
        button {
          ...ButtonFragment
        }
        argomento {
          label
          slug
        }
        badge {
          label
        }
        beneficiari {
          label
        }
        misura {
          label
          slug
          basePath
        }
      }
      ... on SplitBannerRecord {
        __typename
        id
        title
        description
        imgLeft
        lightTheme
        links {
          id
          slug
          title
        }
        image {
          responsiveImage {
            ...ImageFragment
          }
        }
        button {
          ...ButtonFragment
        }
      }
      ... on BannerRecord {
        __typename
        id
        title
        description
        lightTheme
        button {
          ...ButtonFragment
        }
      }
      ... on RichTextRecord {
        __typename
        id
        alignment
        richTextContent: content {
          value
          blocks {
            ...RichTextContentFragment
          }
        }
      }
      ... on VideoPlayerRecord {
        ...VideoPlayerFragment
      }
      ... on NavScrollRecord {
        __typename
        id
        title
        intro {
          ...RichTextFragment
        }
        sectionsContent: content {
          ...ContentSectionFragment
        }
      }
      ... on CardServiceRecord {
        __typename
        id
        title
      }
    }
  }
  _allPagesMeta {
    count
  }
}
