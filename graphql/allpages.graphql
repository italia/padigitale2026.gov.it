query AllPages {
  allPages(first: 100) {
    title
    slug
    body {
      ... on AlertRecord {
        __typename
        text
        color
      }
      ... on ButtonRecord {
        __typename
        id
        href
        target
        text
        icon
        cmsPage {
          title
          slug
        }
      }
      ... on HeroRecord {
        __typename
        lightTheme
        hideBreadcrumbs
        title
        description
        updateDate
        image {
          responsiveImage {
            src
            alt
            aspectRatio
            width
            height
          }
        }
        button {
          id
          href
          target
          text
          icon
          cmsPage {
            title
            slug
          }
        }
      }
      ... on DataHeroRecord {
        __typename
        hideBreadcrumbs
        title
        updateDate
        button {
          icon
          href
          target
          text
          cmsPage {
            slug
            title
          }
        }
        argomento {
          label
          slug
        }
        badge {
          label
        }
        beneficiari {
          label
        }
        misura {
          label
          slug
          basePath
        }
      }
      ... on SplitBannerRecord {
        __typename
        id
        title
        description
        imgLeft
        lightTheme
        links {
          id
          slug
          title
        }
        image {
          responsiveImage {
            src
            alt
            aspectRatio
            width
            height
          }
        }
        button {
          id
          href
          target
          text
          icon
          cmsPage {
            title
            slug
          }
        }
      }
      ... on BannerRecord {
        __typename
        id
        title
        description
        lightTheme
        button {
          id
          href
          target
          text
          icon
          cmsPage {
            title
            slug
          }
        }
      }
    }
  }
  _allPagesMeta {
    count
  }
}
