query AllPages {
  allPages(first: 100) {
    title
    slug
    body {
      ... on AlertRecord {
        __typename
        text
        color
      }
      ... on ButtonRecord {
        __typename
        text
        href
        cmsPage {
          slug
        }
        color
        target
      }
      ... on HeroRecord {
        __typename
        lightTheme
        hideBreadcrumbs
        title
        description
        updateDate
        image {
          responsiveImage {
            __typename
            src
            alt
            aspectRatio
            width
            height
          }
        }
        button {
          color
          href
          id
          size
          target
          text
          icon
          cmsPage {
            title
            slug
          }
        }
      }
      ... on SplitBannerRecord {
        __typename
        id
        title
        description
        imgLeft
        lightTheme
        links {
          id
          slug
          title
        }
        image {
          responsiveImage {
            __typename
            src
            alt
            aspectRatio
            width
            height
          }
        }
        button {
          color
          href
          id
          size
          target
          text
          icon
          cmsPage {
            title
            slug
          }
        }
      }
      ... on BannerRecord {
        __typename
        id
        title
        description
        lightTheme
        button {
          color
          href
          id
          size
          target
          text
          icon
          cmsPage {
            title
            slug
          }
        }
      }
    }
  }
  _allPagesMeta {
    count
  }
}
