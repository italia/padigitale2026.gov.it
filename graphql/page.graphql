query Page($slug: String) {
  page(filter: { slug: { eq: $slug } }) {
    title
    slug
    body {
      ... on AlertRecord {
        __typename
        text
        color
      }
      ... on ButtonRecord {
        __typename
        id
        href
        target
        text
        icon
        cmsPage {
          title
          slug
        }
      }
      ... on HeroRecord {
        __typename
        lightTheme
        hideBreadcrumbs
        title
        description
        updateDate
        image {
          responsiveImage {
            __typename
            src
            alt
            aspectRatio
            width
            height
          }
        }
        button {
          __typename
          id
          href
          target
          text
          icon
          cmsPage {
            title
            slug
          }
        }
      }
      ... on DataHeroRecord {
        __typename
        hideBreadcrumbs
        title
        updateDate
        button {
          __typename
          icon
          href
          target
          text
          cmsPage {
            slug
            title
          }
        }
        argomento {
          label
          slug
        }
        badge {
          label
        }
        beneficiari {
          label
        }
        misura {
          label
          slug
          basePath
        }
      }
      ... on SplitBannerRecord {
        __typename
        id
        title
        description
        imgLeft
        lightTheme
        links {
          id
          slug
          title
        }
        image {
          responsiveImage {
            __typename
            src
            alt
            aspectRatio
            width
            height
          }
        }
        button {
          __typename
          id
          href
          target
          text
          icon
          cmsPage {
            title
            slug
          }
        }
      }
      ... on BannerRecord {
        __typename
        id
        title
        description
        lightTheme
        button {
          __typename
          id
          href
          target
          text
          icon
          cmsPage {
            title
            slug
          }
        }
      }
      ... on RichTextRecord {
        __typename
        id
        alignment
        content {
          value
          blocks {
            ... on ImagesGridRecord {
              __typename
              id
              images {
                url
                basename
                alt
                format
                width
                height
                id
                title
                responsiveImage {
                  src
                  srcSet
                  title
                  width
                  height
                  alt
                  aspectRatio
                }
              }
            }
            ... on LinkRecord {
              __typename
              id
              href
              icon
              target
              text
              cmsPage {
                slug
                title
                id
              }
            }
            ... on ButtonRecord {
              __typename
              id
              href
              icon
              target
              text
              cmsPage {
                slug
                title
                id
              }
            }
          }
        }
      }
    }
  }
}
