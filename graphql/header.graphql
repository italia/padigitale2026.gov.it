query Header {
  header {
    title
    subtitle
    mainLinks {
      ... on PageRecord {
        id
        slug
        title
      }
      ... on DatiRecord {
        id
        slug
        title
      }
    }
    secondaryLinks {
      ... on PageRecord {
        id
        slug
        title
      }
      ... on DatiRecord {
        id
        slug
        title
      }
    }
  }
}
